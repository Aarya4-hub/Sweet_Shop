<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sweet Delights</title>
  <style>
    body { font-family: Arial, sans-serif; margin:0; background:#fff3e6; }
    header { background:#ff6f61; color:white; padding:20px; text-align:center; }
    nav a { margin:0 15px; color:white; text-decoration:none; }
    .products { display:flex; justify-content:center; flex-wrap:wrap; margin:20px; }
    .card { background:white; border:1px solid #ddd; border-radius:8px; width:200px; margin:10px; padding:10px; text-align:center; }
    .card img { width:100%; border-radius:8px; }
    button { background:#ff6f61; color:white; border:none; padding:8px 12px; margin-top:10px; cursor:pointer; border-radius:5px; }
    #cart { background:#fff; padding:20px; margin:20px; border:2px solid #ff6f61; }
  </style>
</head>
<body>
  <header>
    <h1>🍬 Sweet Delights</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <section class="products">
    <div class="card">
      <img src="https://via.placeholder.com/200x150?text=Gulab+Jamun" alt="Gulab Jamun">
      <h3>Gulab Jamun</h3>
      <button onclick="addToCart('Gulab Jamun')">Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/200x150?text=Rasgulla" alt="Rasgulla">
      <h3>Rasgulla</h3>
      <button onclick="addToCart('Rasgulla')">Add to Cart</button>
    </div>
    <div class="card">
      <img src="https://via.placeholder.com/200x150?text=Ladoo" alt="Ladoo">
      <h3>Ladoo</h3>
      <button onclick="addToCart('Ladoo')">Add to Cart</button>
    </div>
  </section>

  <section id="cart">
    <h2>🛒 Your Cart</h2>
    <ul id="cart-items"></ul>
  </section>

  <script>
    function addToCart(item) {
      const cartList = document.getElementById('cart-items');
      const li = document.createElement('li');
      li.textContent = item;
      cartList.appendChild(li);
    }
  </script>
</body>
</html>
